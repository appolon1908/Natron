name: Owned sidecar source and frozen native snapshot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  video-sidecar-source:
    name: video-sidecar-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BOOTSTRAP_BASE_SHA: c987a8c88b3d718eaff790e672bcde524d3da312
      PYTHONDONTWRITEBYTECODE: '1'
      CODESTRA_VIDEO_RENDER_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate frozen native boundary and owned API behavior
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          source_ci="$RUNNER_TEMP/trusted-video-source-ci"
          mkdir -p "$source_ci"
          if git cat-file -e "$BASE_SHA:.github/video-source-boundary.json" 2>/dev/null; then
            git diff --exit-code "$BASE_SHA" -- .github governance/interim-release-policy.json
            git archive "$BASE_SHA" .github | tar -x -C "$source_ci"
          else
            test "$BASE_SHA" = "$BOOTSTRAP_BASE_SHA"
            cp -R .github "$source_ci/"
          fi
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$source_ci/.github/requirements-video-source.txt"
          python "$source_ci/.github/scripts/validate_sidecar_scope.py"
          python -m unittest discover -s "$source_ci/.github/scripts" -p 'test_sidecar*.py'
      - name: Scan all tracked history and effective files with trusted controls
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          : > "$RUNNER_TEMP/no-video-secret-exemptions"
          python "$RUNNER_TEMP/trusted-video-source-ci/.github/scripts/scan_sidecar_secrets.py" \
            --scanner "$RUNNER_TEMP/gitleaks" \
            --config "$RUNNER_TEMP/trusted-video-source-ci/.github/gitleaks-source.toml" \
            --ignore-path "$RUNNER_TEMP/no-video-secret-exemptions" \
            --reports "$RUNNER_TEMP/video-secret-reports"
